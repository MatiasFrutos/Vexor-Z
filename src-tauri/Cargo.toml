[package]
name = "vexor"
version = "0.6.1"
description = "Vexor — terminal moderna con IA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
